<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidak ada sinyal</title>
<style>
:root{--latar:#f3f6f7;--teks:#1d2a30;--redup:#5a6b73}

body{margin:0;background:var(--latar);color:var(--teks);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh;padding:24px;box-sizing:border-box;text-align:center}
p{color:var(--redup);margin:8px 0 0}
</style>
</head>
<body>
<main>
<h1>Tidak ada sinyal</h1>
<p>Aplikasi ini membutuhkan koneksi. Halaman akan bisa dibuka kembali saat sinyal tersedia.</p>
</main>
</body>
</html>
